[project]
name = "market-pulse-backend"
version = "0.1.0"
description = "FastAPI backend for the MarketPulse stock and crypto analyst"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "yfinance>=0.2.54,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "openai-agents>=0.2,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false
